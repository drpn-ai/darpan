name: Darpan Backend CI

# Restores automated backend CI (MACH maturity audit P0 #2). `drpn-ai/darpan` is a Moqui
# *component* repo, so the framework has to be assembled around the checked-out code before the
# JUnit suite (88 result files / 799 @Test on H2) can run. Assembly mirrors the verified darpan-cli
# bootstrap recipe (REPO_MANIFEST in darpan-cli/bin/darpan): clone moqui-framework -> getRuntime ->
# place moqui-sftp + ALL 4 Darpan components (darpan under test + darpan-hotwax + netsuite-darpan +
# shopify-darpan) -> load (H2) -> test. The 3 integration components are mandatory, not optional:
# darpan's own main code and tests resolve their entities by name (darpan.hotwax.*, ShopifyAuthConfig,
# Ns* configs), so omitting them makes those entity reads throw EntityNotFoundException at runtime.
# The Spark 3.5 / JDK 21 `--add-opens` set is already injected by the component's own test task
# jvmArgs (build.gradle: sparkJava21Opens), so it does not need to be re-declared here.
#
# Two datasources, on purpose. The bulk of the suite runs on the embedded H2 datasource. A small
# MySQL-backed suite (`mysqlTest`, @Tag("mysql")) runs against the service container below, because
# H2 does not implement InnoDB's FK parent-row locking and the login self-deadlock it guards is
# therefore INVISIBLE on H2. Without that step the regression test guards nothing and a future green
# build can silently revert the fix. The two share one job: the H2 tests are unaffected by a MySQL
# service being present, and assembling the framework twice would double the slowest part of CI.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # MACH P2 (security): repo-wide secret scan. Runs the pinned gitleaks binary directly —
  # the marketplace action requires an org license secret (a devops dependency); the binary
  # does not. fetch-depth: 0 so history is scanned, not just the tip.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact --verbose

  backend-tests:
    name: Component test suite (JDK 21, H2 + MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      # mysql:8.4 deliberately, not 9.x — this mirrors the production server version. The suite is
      # also run locally against 9.3 and the InnoDB locking semantics it depends on are the same on
      # both, but CI should fail where production would fail.
      #
      # MYSQL_DATABASE creates the schema; Moqui creates its own tables on demand and the suite
      # needs no seed data (the locally proven fixture database likewise holds tables but zero seed
      # rows), so there is nothing further to provision.
      #
      # The credentials below are the service container's own throwaway root account. They exist
      # only for the life of the job, are reachable only from this runner, and grant nothing
      # anywhere else.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: darpan_ci_root
          MYSQL_DATABASE: darpan_test
        ports:
          - 3306:3306
        # Without a health check the first step can open a connection to a half-booted server and
        # fail in a way that looks like a test failure. start-period covers first-boot initdb.
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=darpan_ci_root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=30s

    steps:
      - name: Check out darpan component (code under test)
        uses: actions/checkout@v5
        with:
          path: component-darpan
          fetch-depth: 0

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('component-darpan/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # DO NOT "restore" this to moqui/moqui-framework@master. drpn-ai/moqui-framework is OUR FORK,
      # and its master carries the prod-pinned upstream ref (d12a86e1) plus the login self-deadlock
      # fix (merged as 8cde954b): getLoginKey no longer issues the FK-child UserLoginKey insert under
      # requireNewTransaction, which used to suspend a caller already X-locking the parent
      # USER_ACCOUNT row. UPSTREAM master does NOT contain that fix, so building against it would run
      # the mysqlTest regression suite against code that still has the defect — CI would go red, or
      # worse, someone would delete the test. The fork and upstream share a branch name; that is the
      # whole trap. Check the URL, not the branch.
      #
      # This tracks the fork's master branch, replacing tag v4.0.0-drpn.1 on 2026-08-18 (that tag
      # dereferences to c618faf1 and predates the fix). Consequence: the ref MOVES, so CI is no
      # longer pinned to an immutable framework — a green run does not prove a later run builds the
      # same code. darpan-docker-config's two Dockerfiles pin the same branch via
      # MOQUI_FRAMEWORK_REF, so CI and the production image still build the same framework; all
      # three must move together. Retire the fork by repointing all three at an upstream ref once
      # the fix is merged there.
      - name: Clone Moqui framework (drpn-ai fork, master)
        run: |
          git clone --depth 1 --branch master \
            https://github.com/drpn-ai/moqui-framework.git darpan-backend
          git -C darpan-backend log --oneline -1

      - name: Download Moqui runtime (must precede component placement)
        working-directory: darpan-backend
        run: ./gradlew --no-daemon --console=plain getRuntime

      - name: Place components (moqui-sftp + the 4 Darpan components — darpan under test + 3 integrations)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master https://github.com/moqui/moqui-sftp.git \
            darpan-backend/runtime/component/moqui-sftp
          # darpan's main code and test suite reference sibling-component entities: darpan-hotwax
          # owns darpan.hotwax.HotWaxOmsRestSourceConfig and shopify-darpan owns
          # darpan.shopify.ShopifyAuthConfig (the Ns* configs are canonical in darpan itself, so
          # netsuite-darpan is a consumer placed only to assemble the full, proven platform). All
          # three are public drpn-ai repos on `main` and part of the canonical darpan-cli
          # REPO_MANIFEST. Without darpan-hotwax/shopify-darpan those entity definitions never load
          # and ~24 darpan tests fail with EntityNotFoundException in their shared @BeforeEach.
          for repo in darpan-hotwax netsuite-darpan shopify-darpan; do
            git clone --depth 1 --branch main "https://github.com/drpn-ai/${repo}.git" \
              "darpan-backend/runtime/component/${repo}"
          done
          mv component-darpan darpan-backend/runtime/component/darpan

      - name: Load seed data into the embedded H2 database
        working-directory: darpan-backend
        run: ./gradlew --no-daemon --console=plain load

      - name: Run darpan component test suite
        working-directory: darpan-backend
        run: ./gradlew --no-daemon --console=plain :runtime:component:darpan:test

      # Bitronix issues `XA RECOVER` when it initialises the datasource, and MySQL refuses that
      # statement without XA_RECOVER_ADMIN ON *.* — it comes back as XAER_RMERR and takes the whole
      # run down before a single test executes. We connect as the container's root account, which
      # already holds the privilege, so no GRANT step is needed; if this is ever repointed at a
      # dedicated user, that user needs `GRANT XA_RECOVER_ADMIN ON *.* ` explicitly. Asserting it
      # here turns a confusing mid-suite stack trace into a one-line failure.
      - name: Verify MySQL service is reachable and holds XA_RECOVER_ADMIN
        run: |
          set -euo pipefail
          # Uses the mysql:8.4 client from the image the service container already pulled, so this
          # does not depend on which MySQL client the runner image happens to ship.
          grants=$(docker run --rm --network host mysql:8.4 \
            mysql --host=127.0.0.1 --port=3306 --user=root --password=darpan_ci_root \
                  --batch --skip-column-names --execute="SHOW GRANTS FOR CURRENT_USER();")
          echo "$grants"
          echo "$grants" | grep -q 'XA_RECOVER_ADMIN\|ALL PRIVILEGES ON \*\.\*' || {
            echo "::error::MySQL test account lacks XA_RECOVER_ADMIN ON *.* — Bitronix XA RECOVER will fail with XAER_RMERR"
            exit 1
          }

      # The reason this workflow has a database at all. `test` EXCLUDES @Tag("mysql")
      # (build.gradle), so without this step the login-deadlock regression test runs nowhere and the
      # fix can be reverted by a green build. Must stay after `test`: both are Test tasks and each
      # clears its own build/test-results directory, but they are separate tasks and do not conflict.
      #
      # --no-daemon matters here beyond speed: Gradle seeds a Test task's environment from the build
      # JVM, and a reused daemon would carry the environment it started with, not these values.
      - name: Run MySQL-backed regression suite (login deadlock)
        working-directory: darpan-backend
        env:
          DARPAN_TEST_DB_HOST: 127.0.0.1
          DARPAN_TEST_DB_PORT: '3306'
          DARPAN_TEST_DB_NAME: darpan_test
          DARPAN_TEST_DB_USER: root
          DARPAN_TEST_DB_PASSWORD: darpan_ci_root
        run: ./gradlew --no-daemon --console=plain :runtime:component:darpan:mysqlTest

      # Coverage ratchet (MACH P1): reuses the execution data from :test — no test rerun.
      # Floors sit ~2 points below the measured baseline (build.gradle jacoco block).
      - name: Enforce coverage floors (Jacoco)
        working-directory: darpan-backend
        run: ./gradlew --no-daemon --console=plain :runtime:component:darpan:jacocoTestCoverageVerification

      # Contract-drift guard (MACH P0, API management). The XML <-> committed-contract gate
      # already runs inside :test (ApiContractGeneratorTests); this step extends the guard to
      # the docs service catalog. The UI side is enforced by darpan-ui's own CI
      # (src/lib/api/__tests__/contractDrift.spec.ts against its committed methods.txt copy).
      - name: Check docs service catalog against the generated API contract
        run: |
          git clone --depth 1 https://github.com/drpn-ai/darpan-docs.git darpan-docs
          cd darpan-docs && python3 scripts/check_service_catalog.py \
            ../darpan-backend/runtime/component/darpan/docs/api-contract/methods.txt

      # Contract compatibility gate (MACH P1): breaking facade changes (removed method/param/
      # field, type change) fail PRs unless x-darpan-contract-version was consciously bumped.
      # Additive changes always pass (additive-only deprecation policy).
      - name: Check facade contract compatibility against PR base
        if: github.event_name == 'pull_request'
        working-directory: darpan-backend/runtime/component/darpan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "${BASE_SHA}:docs/api-contract/openapi.json" 2>/dev/null; then
            git show "${BASE_SHA}:docs/api-contract/openapi.json" > /tmp/base-openapi.json
            python3 scripts/check_contract_compat.py /tmp/base-openapi.json docs/api-contract/openapi.json
          else
            echo "no committed contract at PR base — first contract commit, skipping compat gate"
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: darpan-test-reports
          # Both suites, and the raw XML as well as the HTML: a Test task reports BUILD SUCCESSFUL
          # even when it matched zero tests, so the per-suite XML is the only proof of what ran.
          path: |
            darpan-backend/runtime/component/darpan/build/reports/tests/test/
            darpan-backend/runtime/component/darpan/build/reports/tests/mysqlTest/
            darpan-backend/runtime/component/darpan/build/test-results/test/
            darpan-backend/runtime/component/darpan/build/test-results/mysqlTest/
          if-no-files-found: ignore
