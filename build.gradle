apply plugin: 'groovy'

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

def componentNode = parseComponent(project)
version = componentNode.'@version'
def jarBaseName = componentNode.'@name'
def moquiDir = projectDir.parentFile.parentFile.parentFile
def frameworkDir = file(moquiDir.absolutePath + '/framework')

repositories {
    flatDir name: 'localLib', dirs: frameworkDir.absolutePath + '/lib'
    mavenCentral()
    // jitpack only serves json-schema-inferrer; scoped so it cannot shadow anything else
    // (dependency confusion) and url uses assignment form (space form breaks under Gradle 10).
    maven {
        url = 'https://jitpack.io'
        content { includeModule('com.github.saasquatch', 'json-schema-inferrer') }
    }
}

sourceSets {
    main {
        groovy { srcDirs = ['src/main/groovy'] }
    }
    test {
        groovy { srcDirs = ['src/test/groovy'] }
    }
}

// Log4J has annotation processors, disable to avoid warning
tasks.withType(JavaCompile) { options.compilerArgs << "-proc:none" }
tasks.withType(GroovyCompile) { options.compilerArgs << "-proc:none" }

dependencies {
    implementation project(':framework')
    // moqui-sftp is deliberately NOT a compile dependency (ADR 0001 rule 1: plugins depend on
    // core, never the reverse). SftpAutomationSupport resolves org.moqui.sftp.SftpClient at
    // runtime from the Moqui classloader; the component is a deploy-time plugin.
    implementation 'org.apache.spark:spark-sql_2.12:3.5.1'
    // Spark 3.5.x is built against the legacy javax.servlet API (UI + MetricsServlet); Moqui 4 only ships
    // jakarta.servlet, so provide javax.servlet-api for Spark. Different namespace — coexists with jakarta.
    implementation 'javax.servlet:javax.servlet-api:4.0.1'
    implementation 'com.networknt:json-schema-validator:1.5.5' // bumped from 1.0.87: 4-major behind + transitive CVEs
    implementation 'com.jayway.jsonpath:json-path:2.9.0'       // bumped from 2.8.0 for CVE-2023-51074 (stack-overflow DoS in Criteria.parse)
    // json-path -> json-smart -> accessors-smart pins org.ow2.asm:asm:9.3, which cannot read Java 21
    // bytecode (max major 63). addRuntime merges component libs into the exec war's WEB-INF/lib, where
    // the stale ASM wins the flat classloader and Jetty ee11 annotation scanning fails on every
    // JDK21-compiled class ("Unable to parse class ... darpan-hotwax-0.2.0.jar"), aborting the ROOT
    // webapp at boot. Pin ASM >= 9.5 (9.8 = Java 25 support, matches the Jetty 12.1 line).
    implementation 'org.ow2.asm:asm:9.8'
    implementation 'com.github.saasquatch:json-schema-inferrer:0.1.5'
    // Connector/J 9.x per DevOps MySQL 8.0→8.4 server upgrade (9.x is compatible with both).
    // The upgrade notice named "9.7.2" but Maven Central has no such artifact — 9.7.0 is the
    // newest 9.x release (the line then jumps to Oracle's 26.x numbering). 9.x has no
    // com.mysql.jdbc.* legacy aliases — deployments MUST select the mysql8 database conf
    // (com.mysql.cj.* driver/XA classes), never the legacy mysql entry.
    runtimeOnly 'com.mysql:mysql-connector-j:9.7.0'
    // Chelan runs Postgres (MoquiProductionConf.xml datasource is PGXADataSource); the MySQL
    // connector stays for local/dev compose stacks that still point at MySQL.
    runtimeOnly 'org.postgresql:postgresql:42.7.7'

    // Drools (MACH P1: off EOL 7.73.0.Final → 8.44.0.Final). Drools 8.x module set for the classic
    // KieFileSystem DRL + MVEL-dialect compilation: drools-engine (runtime; pulls drools-core/compiler at
    // matching versions), drools-mvel (still REQUIRED in 8.x for `dialect "mvel"` constraints — without it
    // buildAll fails "compile a Drools asset without mvel"), drools-xml-support (kmodule.xml), kie-api.
    // NOTE: drools-mvel's legacy evaluators trip a cross-classloader EvaluatorDefinition ClassCastException
    // under Moqui's component MClassLoader — RuleEngineSupport.compile pins the thread-context classloader
    // around buildAll() to resolve it. MVEL is managed transitively by 8.x (its build dropped the
    // JDK-removed java.lang.Compiler reference, so the old manual mvel2 2.5.x pin is no longer needed).
    implementation 'org.drools:drools-engine:8.44.0.Final'
    implementation 'org.drools:drools-mvel:8.44.0.Final'
    implementation 'org.drools:drools-xml-support:8.44.0.Final'
    implementation 'org.kie:kie-api:8.44.0.Final'

    // Transitive-CVE pins. Spark 3.5.1 inherits older protobuf/avro/netty versions with public advisories;
    // we pin forward without bumping Spark itself. Netty uses its BOM (pulls every netty-* artifact to 4.1.125).
    //   protobuf-java 3.25.5  — CVE-2024-7254 (HIGH, stack-overflow on nested groups)
    //   avro 1.11.4           — CVE-2024-47561 (CRITICAL, RCE on Avro schema parse)
    //   netty-bom 4.1.125     — HTTP request-smuggling chain (GHSA-fghv-69vj-qj49 / -38f8-5428-x5cv / -84h7-rjj3-6jx4 / -wm47-8v5p-wjpj)
    implementation platform('io.netty:netty-bom:4.1.125.Final')
    constraints {
        implementation('com.google.protobuf:protobuf-java:3.25.5') { because 'CVE-2024-7254 (HIGH)' }
        implementation('org.apache.avro:avro:1.11.4')              { because 'CVE-2024-47561 (CRITICAL)' }
    }

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.9.2' // Gradle 8/9 no longer auto-provides the launcher
    testRuntimeOnly 'jakarta.servlet:jakarta.servlet-api:6.1.0' // Moqui 4 boots a jakarta servlet context; framework supplies it as provided
    // moqui-atomikos retired: Moqui 4 embeds Bitronix (TransactionInternalBitronix) as the default JTA TM.
}

// by default the Java plugin runs test on build, change to not do that (only run test if explicit task)
check.dependsOn.clear()

// Apache Spark requires these JDK module openings on Java 17+/21 (Spark's own JavaModuleOptions);
// without them Spark SQL throws IllegalAccessError on sun.nio.ch.DirectBuffer at SparkContext init.
ext.sparkJava21Opens = [
        '--add-opens=java.base/java.lang=ALL-UNNAMED',
        '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED',
        '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
        '--add-opens=java.base/java.io=ALL-UNNAMED',
        '--add-opens=java.base/java.net=ALL-UNNAMED',
        '--add-opens=java.base/java.nio=ALL-UNNAMED',
        '--add-opens=java.base/java.util=ALL-UNNAMED',
        '--add-opens=java.base/java.util.concurrent=ALL-UNNAMED',
        '--add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED',
        '--add-opens=java.base/sun.nio.ch=ALL-UNNAMED',
        '--add-opens=java.base/sun.nio.cs=ALL-UNNAMED',
        '--add-opens=java.base/sun.security.action=ALL-UNNAMED',
        '--add-opens=java.base/sun.util.calendar=ALL-UNNAMED',
        '--add-opens=java.security.jgss/sun.security.krb5=ALL-UNNAMED'
]

test {
    // MySQL-backed tests (@Tag("mysql")) need real InnoDB locking semantics and stay opt-in via
    // the mysqlTest task below, so everyday `./gradlew test` keeps running H2-fast.
    useJUnitPlatform { excludeTags 'mysql' }
    // Moqui keeps process-global state; isolate smoke test classes so fixture DBs do not leak.
    maxParallelForks = 1
    forkEvery = 1
    // JDK 21: open modules for Spark, and quiet the ByteBuddy/Mockito dynamic-agent warning.
    jvmArgs(sparkJava21Opens + ['-XX:+EnableDynamicAgentLoading', '--enable-native-access=ALL-UNNAMED'])
}

// Opt-in MySQL-backed suite (InnoDB lock behavior that H2 cannot reproduce — no FK parent-row
// locking in H2). Requires a locally reachable darpan_test MySQL database; not part of `check` or
// the default `test` task. Run with `./gradlew :runtime:component:darpan:mysqlTest`.
tasks.register('mysqlTest', Test) {
    useJUnitPlatform { includeTags 'mysql' }
    // Tag filtering happens inside each forked worker, after Gradle has already decided how many
    // to fork — an uncapped maxParallelForks churns a heavy Moqui/Spark JVM per compiled test class
    // just to find the few @Tag("mysql") ones. Cap at 1, matching `test` above; this task is the
    // only guard for MySQL-only defects (InnoDB locking) that H2 cannot reproduce.
    maxParallelForks = 1
    // Moqui keeps process-global state (System properties, ECFI); one test class per JVM.
    forkEvery = 1
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    // Same JDK 21 module opens as `test` — Spark/Netty classes can load during ECFI init.
    jvmArgs(sparkJava21Opens + ['-XX:+EnableDynamicAgentLoading', '--enable-native-access=ALL-UNNAMED'])
}

// Coverage measurement + enforced ratchet floor (MACH P1, code quality). Floors sit ~2 points
// below the measured baseline so they catch regressions without blocking normal work; raise
// them as coverage grows. CI runs jacocoCoverageVerification right after :test (reuses the
// same execution data, no test rerun).
apply plugin: 'jacoco'
jacoco { toolVersion = '0.8.12' }
jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}
jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            // Baseline measured 2026-07-02: LINE 77.57%, BRANCH 52.14% (413-test suite).
            limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.755 }
            limit { counter = 'BRANCH'; value = 'COVEREDRATIO'; minimum = 0.50 }
        }
    }
}

task cleanLib(type: Delete) { delete fileTree(dir: projectDir.absolutePath+'/lib', include: '*') }
clean.dependsOn cleanLib

String getDarpanPropertyOrEnv(String propertyName, String envName, String defaultValue) {
    if (project.properties.containsKey(propertyName)) return project.property(propertyName).toString()

    String envValue = System.getenv(envName)
    return envValue ? envValue : defaultValue
}

List<String> splitDarpanArgs(String argString) {
    String trimmedArgs = argString?.trim()
    if (!trimmedArgs) return []
    return trimmedArgs.split(/\s+/) as List<String>
}

List<String> getDarpanLoadPassthroughArgs() {
    List<String> passthroughArgs = []

    if (project.properties.containsKey('timeout')) passthroughArgs.add("timeout=${project.property('timeout')}")

    [
            'raw',
            'no-fk-create',
            'dummy-fks',
            'use-try-insert',
            'disable-eeca',
            'disable-audit-log',
            'disable-data-feed',
            'no-run-es'
    ].each { String flagName ->
        if (project.properties.containsKey(flagName)) passthroughArgs.add(flagName)
    }

    passthroughArgs.addAll(splitDarpanArgs(getDarpanPropertyOrEnv('extraLoadArgs', 'DARPAN_UPGRADE_DATA_LOAD_ARGS', '')))
    return passthroughArgs
}

List<String> getDarpanJavaExecArgs() {
    List<String> javaArgs = [
            '-server',
            '--add-exports=java.base/sun.nio.ch=ALL-UNNAMED',
            '--add-opens=java.base/java.nio=ALL-UNNAMED',
            '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED',
            '--add-opens=java.base/java.util=ALL-UNNAMED'
    ]
    javaArgs.addAll(splitDarpanArgs(System.getenv('JAVA_OPTS') ?: ''))
    return javaArgs.unique()
}

task loadDarpanUpgradeData(type: JavaExec) {
    group = "Moqui"
    description = "Idempotently load all Darpan seed/reference data (types=darpan-seed) so a deploy ensures every required record is present and any new seed data is applied. Excludes darpan-fixture test data."

    String moquiConfPath = getDarpanPropertyOrEnv(
            'moquiConf',
            'CONF_FILE',
            new File(moquiDir, 'runtime/conf/MoquiProductionConf.xml').absolutePath
    )
    String moquiRuntimePath = getDarpanPropertyOrEnv(
            'moquiRuntime',
            'MOQUI_RUNTIME',
            new File(moquiDir, 'runtime').absolutePath
    )
    File moquiWarFile = file(getDarpanPropertyOrEnv(
            'moquiWar',
            'MOQUI_WAR',
            new File(moquiDir, 'moqui-plus-runtime.war').absolutePath
    ))
    // Default to loading BY TYPE with no fixed location so every darpan-seed file (base reference
    // data + release upgrade payloads) is loaded idempotently — new seed files are picked up
    // automatically without editing a curated aggregate. Test/UAT fixtures use type "darpan-fixture"
    // and are intentionally excluded. Set DARPAN_UPGRADE_DATA_LOCATION only to force a single file.
    String upgradeDataLocation = getDarpanPropertyOrEnv(
            'upgradeDataLocation',
            'DARPAN_UPGRADE_DATA_LOCATION',
            ''
    )
    String upgradeDataTypes = getDarpanPropertyOrEnv(
            'types',
            'DARPAN_UPGRADE_DATA_TYPES',
            'darpan-seed'
    )
    List<String> loadArgs = [
            moquiWarFile.absolutePath,
            'load',
            "conf=${moquiConfPath}",
            "types=${upgradeDataTypes}"
    ]
    if (upgradeDataLocation?.trim()) {
        loadArgs << "location=${upgradeDataLocation}"
    }
    loadArgs += getDarpanLoadPassthroughArgs()

    doFirst {
        if (!moquiWarFile.exists()) {
            throw new GradleException("Moqui runtime WAR not found at ${moquiWarFile.absolutePath}; run addRuntime before loadDarpanUpgradeData.")
        }
        String where = upgradeDataLocation?.trim() ? "location [${upgradeDataLocation}]" : "all component files"
        logger.lifecycle("Loading Darpan seed/upgrade data from ${where} using [types=${upgradeDataTypes}] (idempotent upsert)")
    }

    systemProperties = ['moqui.conf': moquiConfPath, 'moqui.runtime': moquiRuntimePath]
    workingDir = moquiDir
    jvmArgs getDarpanJavaExecArgs()
    mainClass = '-jar'
    args = loadArgs
}

jar {
    destinationDirectory = file(projectDir.absolutePath + '/lib')
    archiveBaseName = jarBaseName
}
task copyDependencies { doLast {
    copy { from (configurations.runtimeClasspath - project(':framework').configurations.runtimeClasspath - project(':framework').tasks.named('jar').get().archiveFile.get().asFile)
        into file(projectDir.absolutePath + '/lib') }
} }
copyDependencies.dependsOn cleanLib
jar.dependsOn copyDependencies

task generateApiContract(type: JavaExec) {
    group = "Build"
    description = "Regenerate docs/api-contract/{openapi.json,methods.txt} from the facade service XML (single source of truth for the remote API)."
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'darpan.contract.ApiContractGenerator'
    args = [projectDir.absolutePath]
}

task checkApiContract(type: JavaExec) {
    group = "Verification"
    description = "Fail when the committed API contract drifts from the facade service XML (same gate ApiContractGeneratorTests enforces in :test)."
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'darpan.contract.ApiContractGenerator'
    args = [projectDir.absolutePath, '--check']
}

task verifyOrganization {
    group = "Verification"
    description = "Verify component locations and docs path references resolve."

    doLast {
        List<String> failures = []

        def lineNumberFor = { String content, int charIndex ->
            content.substring(0, charIndex).count("\n") + 1
        }
        def relativePathFor = { File file ->
            projectDir.toPath().relativize(file.toPath()).toString().replace('\\', '/')
        }
        // Historical docs may retain legacy names for timeline context.
        List<String> legacyReferenceDocExceptions = [
                "docs/history/",
                "docs/reconciliation/history/"
        ]
        def isLegacyDocException = { File file ->
            String relativePath = relativePathFor(file)
            legacyReferenceDocExceptions.any { String prefix -> relativePath.startsWith(prefix) }
        }

        def locationPattern = ~/location\s*=\s*"component:\/\/darpan\/([^"]+)"/
        fileTree(dir: projectDir, include: ["service/**/*.xml", "screen/**/*.xml"]).files.sort { it.path }.each { File xmlFile ->
            String xmlText = xmlFile.getText("UTF-8")
            def matcher = locationPattern.matcher(xmlText)
            while (matcher.find()) {
                String relativePath = matcher.group(1)
                File target = new File(projectDir, relativePath)
                if (!target.exists()) {
                    int lineNumber = lineNumberFor(xmlText, matcher.start())
                    failures.add("${xmlFile.path}:${lineNumber} missing component target component://darpan/${relativePath}")
                }
            }
        }

        File docsDir = new File(projectDir, "docs")
        if (docsDir.exists()) {
            def codePattern = ~/`([^`]+)`/
            fileTree(dir: docsDir, include: ["**/*.md"]).files.sort { it.path }.each { File docFile ->
                String docText = docFile.getText("UTF-8")
                def matcher = codePattern.matcher(docText)
                while (matcher.find()) {
                    String token = matcher.group(1)?.trim()
                    if (!token?.startsWith("runtime/component/darpan/")) continue

                    File target = new File(rootDir, token)
                    if (!target.exists()) {
                        int lineNumber = lineNumberFor(docText, matcher.start())
                        failures.add("${docFile.path}:${lineNumber} missing docs path ${token}")
                    }
                }
            }
        }

        List<String> forbiddenLegacyArtifacts = [
                "screen/Rules.xml",
                "service/darpan/rule/RuleServices.xml",
                "src/main/groovy/darpan/rule/service/generateDrlFromPrompt.groovy",
                "entity/PartyEntities.xml",
                "screen/Reconciliation/UiFacadePoc.xml",
                "docs/reconciliation/poc/ui-facade-poc-screen.md"
        ]
        forbiddenLegacyArtifacts.each { String relativePath ->
            File artifact = new File(projectDir, relativePath)
            if (artifact.exists()) {
                failures.add("${artifact.path}:1 legacy Rules/party artifact must be removed")
            }
        }
        File legacyRulesDir = new File(projectDir, "screen/Rules")
        if (legacyRulesDir.exists()) {
            failures.add("${legacyRulesDir.path}:1 legacy Rules screen directory must be removed")
        }

        List<File> productionFiles = fileTree(
                dir: projectDir,
                include: ["service/**/*.xml", "screen/**/*.xml", "src/main/groovy/darpan/**/*.groovy"]
        ).files.sort { it.path }

        productionFiles.each { File sourceFile ->
            String sourceText = sourceFile.getText("UTF-8")

            def sampleNamespaceMatcher = ~/\breconciliation\.ReconciliationSampleServices\./
            def sampleNamespace = sampleNamespaceMatcher.matcher(sourceText)
            while (sampleNamespace.find()) {
                int lineNumber = lineNumberFor(sourceText, sampleNamespace.start())
                failures.add("${sourceFile.path}:${lineNumber} production references reconciliation.ReconciliationSampleServices.*")
            }

            def samplePathMatcher = ~/\breconciliation\/sample\//
            def samplePath = samplePathMatcher.matcher(sourceText)
            while (samplePath.find()) {
                int lineNumber = lineNumberFor(sourceText, samplePath.start())
                failures.add("${sourceFile.path}:${lineNumber} production references reconciliation/sample path")
            }

            def uiFacadePocMatcher = ~/\bUiFacadePoc\b/
            def uiFacadePoc = uiFacadePocMatcher.matcher(sourceText)
            while (uiFacadePoc.find()) {
                int lineNumber = lineNumberFor(sourceText, uiFacadePoc.start())
                failures.add("${sourceFile.path}:${lineNumber} backend must not carry custom UI/PWA POC surface UiFacadePoc")
            }
        }

        List<File> productionScreenAndServiceFiles = fileTree(
                dir: projectDir,
                include: ["service/**/*.xml", "screen/**/*.xml"]
        ).files.sort { it.path }

        productionScreenAndServiceFiles.each { File xmlFile ->
            String xmlText = xmlFile.getText("UTF-8")
            def debugCallPattern = ~/\bdebug\.[A-Za-z0-9_.#]+/
            def debugCallMatcher = debugCallPattern.matcher(xmlText)
            while (debugCallMatcher.find()) {
                int lineNumber = lineNumberFor(xmlText, debugCallMatcher.start())
                failures.add("${xmlFile.path}:${lineNumber} production screen/service references debug namespace")
            }
        }

        List<File> legacyReferenceFiles = fileTree(
                dir: projectDir,
                include: ["entity/**/*.xml", "service/**/*.xml", "screen/**/*.xml", "src/main/groovy/**/*.groovy", "docs/**/*.md"]
        ).files.sort { it.path }
        legacyReferenceFiles.each { File sourceFile ->
            if (isLegacyDocException(sourceFile)) return

            String sourceText = sourceFile.getText("UTF-8")

            def legacyRulesRoutePattern = ~/\bscreen\/Rules(?:\.xml|\/[A-Za-z0-9_.\-\/]+)?\b/
            def legacyRulesRouteMatcher = legacyRulesRoutePattern.matcher(sourceText)
            while (legacyRulesRouteMatcher.find()) {
                int lineNumber = lineNumberFor(sourceText, legacyRulesRouteMatcher.start())
                failures.add("${sourceFile.path}:${lineNumber} references legacy /Rules screen surface")
            }

            def legacyRuleServicePattern = ~/\bdarpan\.rule\.RuleServices\b/
            def legacyRuleServiceMatcher = legacyRuleServicePattern.matcher(sourceText)
            while (legacyRuleServiceMatcher.find()) {
                int lineNumber = lineNumberFor(sourceText, legacyRuleServiceMatcher.start())
                failures.add("${sourceFile.path}:${lineNumber} references legacy darpan.rule.RuleServices namespace")
            }

            def legacyEntityPattern = ~/\b(RuleHeader|RuleVersion|RuleAccess|darpan\.party\.[A-Za-z0-9_]+)\b/
            def legacyEntityMatcher = legacyEntityPattern.matcher(sourceText)
            while (legacyEntityMatcher.find()) {
                int lineNumber = lineNumberFor(sourceText, legacyEntityMatcher.start())
                failures.add("${sourceFile.path}:${lineNumber} references removed legacy rule/party entities")
            }
        }

        File mainNavFile = new File(projectDir, "screen/darpan.xml")
        if (mainNavFile.exists()) {
            String navText = mainNavFile.getText("UTF-8")
            def debugRoutePattern = ~/<subscreens-item\b[^>]*\bname\s*=\s*"Debug"[^>]*>/
            def debugRouteMatcher = debugRoutePattern.matcher(navText)
            while (debugRouteMatcher.find()) {
                String debugRouteTag = debugRouteMatcher.group()
                if (!debugRouteTag.contains('menu-include="false"')) {
                    int lineNumber = lineNumberFor(navText, debugRouteMatcher.start())
                    failures.add("${mainNavFile.path}:${lineNumber} Debug route must stay hidden with menu-include=\"false\"")
                }
            }

            def legacyRulesSubscreenPattern = ~/<subscreens-item\b[^>]*\bname\s*=\s*"Rules"\b[^>]*>/
            def legacyRulesSubscreenMatcher = legacyRulesSubscreenPattern.matcher(navText)
            while (legacyRulesSubscreenMatcher.find()) {
                int lineNumber = lineNumberFor(navText, legacyRulesSubscreenMatcher.start())
                failures.add("${mainNavFile.path}:${lineNumber} legacy /Rules navigation item must not exist")
            }
        }

        if (!failures.isEmpty()) {
            logger.error("verifyOrganization failed with ${failures.size()} issue(s):")
            failures.each { logger.error(" - ${it}") }
            throw new org.gradle.api.GradleException("verifyOrganization detected broken component or docs references.")
        }

        logger.lifecycle("verifyOrganization passed: all component and docs paths resolved.")
    }
}
